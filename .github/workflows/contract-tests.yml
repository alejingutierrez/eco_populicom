# Test de contrato de datos — guardia de la auditoría de consistencia 2026-08.
# Corre los tests de apps/web (incluye src/contracts/data-contract.test.ts:
# ventana canónica, universo pertinente en el SQL compartido, tripwire de
# predicados por endpoint y tokens de período SPA↔shared). Sin DB: todo es
# comportamiento puro, SQL capturado con un cliente mock y análisis de fuente.
name: Contract tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/contract-tests.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Data contract (jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test -w apps/web

      # Guardia del sistema de diseño. Es estático (no necesita navegador ni DB) y
      # existe porque un `var(--x)` sin declarar no resuelve a "un color raro":
      # resuelve a NADA, y así llegaron a producción dos bandas de métrica
      # dibujadas con un color inexistente. La sonda de color no puede verlo;
      # comparar referencias contra declaraciones sí.
      - name: Design tokens — referencias sin declarar
        run: python3 apps/web/tools/design-probe/check-tokens.py
