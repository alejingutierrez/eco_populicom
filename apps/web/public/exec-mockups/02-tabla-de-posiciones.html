<!DOCTYPE html>
<html lang="es" data-theme="mando" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECO — Vista Ejecutiva · Tabla de Posiciones</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* ---------- Stat strip ---------- */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat {
      padding: 12px 14px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-label {
      font-size: 10px; font-weight: 700; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .stat-row { display: flex; align-items: flex-end; gap: 10px; justify-content: space-between; }
    .stat-num { font-size: 27px; font-weight: 600; line-height: 1; color: var(--text); }
    .stat-delta { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
    .stat-sub { font-size: 10px; color: var(--text-3); }

    /* ---------- Section header ---------- */
    .sec-head {
      display: flex; align-items: baseline; gap: 12px;
      padding: 0 2px;
    }
    .sec-title { font-size: 17px; font-weight: 700; letter-spacing: var(--letter-display); color: var(--text); }
    .sec-title .muted { color: var(--text-3); font-weight: 500; }
    .sec-note {
      margin-left: auto; font-size: 11px; color: var(--text-3);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .sec-note .caret { color: var(--accent); }
    .legend-key { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-3); }
    .legend-sw { width: 18px; height: 9px; border-radius: 3px; }

    /* ---------- Table ---------- */
    .table-card { overflow: hidden; }
    .lt-grid {
      display: grid;
      grid-template-columns:
        56px           /* Pos */
        1.55fr         /* Agencia */
        1.45fr         /* Índice de Salud */
        128px          /* Tendencia */
        1.25fr         /* Sentimiento */
        118px          /* Riesgo */
        70px           /* Velocidad */
        82px;          /* Alcance */
      gap: 14px;
      align-items: center;
    }
    .lt-head {
      padding: 11px 22px;
      background: var(--canvas-2);
      border-bottom: 1px solid var(--hairline-strong);
    }
    .lt-head .th {
      font-size: 10px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.08em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .th.r { justify-content: flex-end; text-align: right; }
    .th.c { justify-content: center; }
    .th.active { color: var(--accent); }
    .th .caret { font-size: 9px; }

    .lt-row {
      padding: 0 22px;
      height: 52px;
      border-top: 1px solid var(--hairline);
    }
    .lt-row:first-child { border-top: none; }
    .tint-pos { background: color-mix(in oklab, var(--pos-bg) 55%, transparent); }
    .tint-neg { background: color-mix(in oklab, var(--neg-bg) 50%, transparent); }
    .lt-row.row-hover:hover { background: var(--canvas-2); }
    .lt-row.tint-pos.row-hover:hover { background: var(--pos-bg); }
    .lt-row.tint-neg.row-hover:hover { background: var(--neg-bg); }

    /* Pos cell */
    .pos-cell { display: flex; align-items: center; gap: 8px; }
    .pos-rank {
      font-size: 16px; font-weight: 700; color: var(--text); width: 18px;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .pos-delta { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Agencia cell */
    .ag-cell { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .ag-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .ag-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .ag-short { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .ag-sector {
      font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
      border: 1px solid var(--hairline-strong); color: var(--text-2); background: var(--canvas);
    }
    .ag-full {
      font-size: 10.5px; color: var(--text-3); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; padding-left: 16px;
    }

    /* Salud cell */
    .bhi-cell { display: flex; flex-direction: column; gap: 5px; }
    .bhi-top { display: flex; align-items: center; gap: 9px; }
    .bhi-num { font-size: 22px; font-weight: 600; line-height: 1; color: var(--text); }
    .bhi-pill { padding: 2px 7px; font-size: 10px; }
    .seg-bar { display: flex; gap: 2px; align-items: center; position: relative; height: 5px; }
    .seg {
      height: 5px; border-radius: 2px; flex: 1;
      background: color-mix(in oklab, var(--text-3) 22%, transparent);
    }
    .seg.on { opacity: 1; }
    .seg-mark {
      position: absolute; top: -2px; width: 3px; height: 9px; border-radius: 2px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 1.5px var(--canvas);
    }

    /* Sentimiento cell */
    .nss-cell { display: flex; flex-direction: column; gap: 6px; }
    .nss-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nss-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .nss-splits { font-size: 9px; color: var(--text-3); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .split-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in oklab, var(--text-3) 16%, transparent); }

    /* Riesgo cell */
    .risk-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .risk-num { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .risk-pill { padding: 2px 7px; font-size: 9.5px; }

    /* Velocidad cell */
    .vel-cell { text-align: center; }
    .vel-num { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .vel-hot { color: var(--neg); }

    /* Alcance cell */
    .reach-cell { text-align: right; }
    .reach-num { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .reach-sub { font-size: 9.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    (function () {
      const M = window.MOCK;
      const G = M.gov;
      const F = M.fmt;

      const hsl = (a, l) => `hsl(${a.hue} 52% ${l}%)`;

      // ---- sparkline helper ----
      function sparkSVG(arr, w, h, color) {
        const s = M.spark(arr, w, h, 3);
        return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">
          <path d="${s.area}" fill="${color}" opacity="0.10"/>
          <path d="${s.line}" stroke="${color}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${s.last[0].toFixed(1)}" cy="${s.last[1].toFixed(1)}" r="2.4" fill="${color}" stroke="var(--canvas)" stroke-width="1.2"/>
        </svg>`;
      }

      // ---- delta renderers ----
      function rankDeltaHTML(d) {
        if (d > 0) return `<span class="pos-delta" style="color:var(--pos)">▲ ${d}</span>`;
        if (d < 0) return `<span class="pos-delta" style="color:var(--neg)">▼ ${Math.abs(d)}</span>`;
        return `<span class="pos-delta" style="color:var(--text-3)">—</span>`;
      }

      // health = up is good; sentiment up is good
      function bhiDeltaHTML(d) {
        const c = d > 0 ? 'var(--pos)' : d < 0 ? 'var(--neg)' : 'var(--text-3)';
        const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '—';
        return `<span class="stat-delta" style="color:${c}">${arrow} ${F.signed(d)}</span>`;
      }

      // ===== STAT STRIP =====
      // crisis: up is bad → neg color
      const crisisDeltaC = G.crisisDelta > 0 ? 'var(--neg)' : G.crisisDelta < 0 ? 'var(--pos)' : 'var(--text-3)';
      const govCB = M.crisisBand(G.crisis);
      const govSpark = (arr, color) => sparkSVG(arr, 78, 28, color);

      const stats = `
        <div class="stat-strip">
          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Índice de Salud</span>
              ${bhiDeltaHTML(G.bhiDelta)}
            </div>
            <div class="stat-row">
              <span class="stat-num num">${G.bhi}</span>
              ${govSpark(G.trend, 'var(--accent)')}
            </div>
            <div class="stat-sub">Compuesto ponderado · banda Débil</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Sentimiento Neto</span>
              <span class="stat-delta" style="color:var(--neg)">▼ ${F.signed(G.nssDelta)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num" style="color:var(--neg)">${F.signed(G.nss)}</span>
              ${govSpark(G.nssTrend, 'var(--neg)')}
            </div>
            <div class="stat-sub">${G.positivePct}% pos · ${G.neutralPct}% neu · ${G.negativePct}% neg</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Riesgo de Crisis</span>
              <span class="pill ${govCB.cls}">${govCB.label}</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num" style="color:var(--neg)">${G.crisis.toFixed(2)}</span>
              <span class="stat-delta" style="color:${crisisDeltaC}">▲ ${F.signed(G.crisisDelta, 2)}</span>
            </div>
            <div class="stat-sub">${G.inCrisis} en crisis · ${G.inAlert} en alerta</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Menciones · 7 días</span>
              <span class="stat-delta" style="color:var(--neg)">▲ +${G.volDelta}%</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num">${F.compact(G.vol)}</span>
              ${govSpark(G.trend.map((v,i)=>v + (G.crisisTrend[i]*40)), 'var(--text-2)')}
            </div>
            <div class="stat-sub">Alcance ${F.compact(G.reach)} personas</div>
          </div>
        </div>`;

      // ===== SECTION HEADER =====
      const secHead = `
        <div class="sec-head">
          <div class="sec-title">Ranking de salud digital <span class="muted">— ${G.agenciesTracked} agencias · semana cerrada</span></div>
          <div class="sec-note">
            <span class="legend-key"><span class="legend-sw" style="background:var(--pos)"></span>Positivo</span>
            <span class="legend-key"><span class="legend-sw" style="background:var(--text-3)"></span>Neutral</span>
            <span class="legend-key"><span class="legend-sw" style="background:var(--neg)"></span>Negativo</span>
            <span style="width:1px;height:12px;background:var(--hairline-strong);margin:0 2px"></span>
            ordenado por <b style="color:var(--text-2);font-weight:600">Índice de Salud</b> <span class="caret">▾</span>
          </div>
        </div>`;

      // ===== TABLE HEADER =====
      const tableHead = `
        <div class="lt-grid lt-head">
          <span class="th">Pos</span>
          <span class="th">Agencia</span>
          <span class="th active">Índice de Salud <span class="caret">▾</span></span>
          <span class="th">Tendencia 14&nbsp;sem</span>
          <span class="th">Sentimiento</span>
          <span class="th r">Riesgo</span>
          <span class="th c">Velocidad</span>
          <span class="th r">Alcance</span>
        </div>`;

      // ===== ROWS =====
      const sorted = M.agencies.slice().sort((a, b) => b.bhi - a.bhi);
      const N = sorted.length;
      const segLabels = ['Crítico', 'Débil', 'Sano', 'Fuerte'];

      const rows = sorted.map(function (a, idx) {
        const pos = idx + 1;
        const bb = M.bhiBand(a.bhi);
        const cb = M.crisisBand(a.crisis);
        const dotC = hsl(a, 48);

        // tint: top 2 (Turismo/DDEC) positive, bottom 3 (AAA/Salud/Energía) negative
        let tint = '';
        if (pos <= 2) tint = ' tint-pos';
        else if (pos >= N - 2) tint = ' tint-neg';

        // segmented health bar (4 segments) with marker at value
        const segIndex = a.bhi < 40 ? 0 : a.bhi < 60 ? 1 : a.bhi < 80 ? 2 : 3;
        const segColors = ['var(--neg)', 'var(--warn)', 'var(--pos)', 'var(--accent)'];
        const segs = segLabels.map(function (_, si) {
          const on = si === segIndex;
          return `<span class="seg ${on ? 'on' : ''}" style="${on ? 'background:' + segColors[si] : ''}"></span>`;
        }).join('');
        const markPct = Math.min(Math.max(a.bhi, 0), 100);

        // sentiment split bar
        const splitBar = `<div class="split-bar">
            <div style="flex-grow:${a.pos};background:var(--pos)"></div>
            <div style="flex-grow:${a.neu};background:var(--text-3)"></div>
            <div style="flex-grow:${a.neg};background:var(--neg)"></div>
          </div>`;
        const nssC = a.nss > 0 ? 'var(--pos)' : a.nss < 0 ? 'var(--neg)' : 'var(--text-2)';

        const velHot = a.engVel >= 2.0 ? ' vel-hot' : '';

        return `
        <div class="lt-grid lt-row row-hover${tint}">
          <div class="pos-cell">
            <span class="pos-rank num">${pos}</span>
            ${rankDeltaHTML(a.rankDelta)}
          </div>

          <div class="ag-cell">
            <div class="ag-top">
              <span class="ag-dot" style="background:${dotC}"></span>
              <span class="ag-short">${a.short}</span>
              <span class="ag-sector">${a.sector}</span>
            </div>
            <div class="ag-full">${a.name}</div>
          </div>

          <div class="bhi-cell">
            <div class="bhi-top">
              <span class="bhi-num num">${a.bhi}</span>
              <span class="pill ${bb.cls} bhi-pill">${bb.label}</span>
            </div>
            <div class="seg-bar">
              ${segs}
              <span class="seg-mark" style="left:${markPct}%;background:${bb.color}"></span>
            </div>
          </div>

          <div>${sparkSVG(a.trend, 116, 32, bb.color)}</div>

          <div class="nss-cell">
            <div class="nss-top">
              <span class="nss-val" style="color:${nssC}">${F.signed(a.nss)}</span>
              <span class="nss-splits">${a.pos}/${a.neu}/${a.neg}</span>
            </div>
            ${splitBar}
          </div>

          <div class="risk-cell">
            <span class="risk-num num" style="color:${cb.color}">${a.crisis.toFixed(2)}</span>
            <span class="pill ${cb.cls} risk-pill">${cb.label}</span>
          </div>

          <div class="vel-cell">
            <span class="vel-num num${velHot}">${a.engVel.toFixed(1)}×</span>
          </div>

          <div class="reach-cell">
            <div class="reach-num num">${F.compact(a.reach)}</div>
            <div class="reach-sub num">${F.compact(a.vol)} menc.</div>
          </div>
        </div>`;
      }).join('');

      const table = `<div class="card table-card">${tableHead}${rows}</div>`;

      // ===== MOUNT (shell frame) =====
      const content = stats + secHead + table;
      document.getElementById('app').innerHTML = ECOShell.frame({
        active: 'gobierno',
        title: 'Tabla de Posiciones',
        eyebrow: 'Vista ejecutiva · Ranking de salud digital',
        period: '7D',
        content,
      });
    })();
  </script>
</body>
</html>
