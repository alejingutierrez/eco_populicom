<!DOCTYPE html>
<html lang="es" data-theme="mando" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECO — Vista Ejecutiva · Resumen ejecutivo</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="shell.css" />
  <style>
    /* ============================================================
       BLEND A — "Tablero de Mando" (Resumen ejecutivo)
       Fila de modos + KPIs del gobierno + [Ranking 13 agencias | Riel]
       El shell (sidebar + header + page padding/gap) lo pinta ECOShell.
       ============================================================ */

    /* ---------- Fila de modos (control segmentado) ---------- */
    .mode-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .mode-seg {
      display: inline-flex; align-items: center; gap: 3px;
      background: var(--canvas-2); border: 1px solid var(--hairline);
      border-radius: 9px; padding: 4px;
    }
    .mode-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 6px;
      font-size: 12.5px; font-weight: 600; color: var(--text-3);
      white-space: nowrap; transition: color .15s var(--ease), background .15s var(--ease);
    }
    .mode-chip svg { width: 13px; height: 13px; flex: none; opacity: .85; }
    .mode-chip:hover { color: var(--text-2); }
    .mode-chip.active {
      background: var(--accent); color: #fff;
      box-shadow: 0 2px 10px -2px var(--accent-fill), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .mode-note {
      margin-left: auto; font-size: 11px; color: var(--text-3);
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    }
    .mode-note b { color: var(--text-2); font-weight: 600; }
    .mode-note .rule { width: 1px; height: 12px; background: var(--hairline-strong); }

    /* ---------- Stat strip (KPIs) ---------- */
    .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-label {
      font-size: 10px; font-weight: 700; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .stat-row { display: flex; align-items: flex-end; gap: 10px; justify-content: space-between; }
    .stat-num { font-size: 28px; font-weight: 600; line-height: 1; color: var(--text); }
    .stat-delta { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
    .stat-sub { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    /* ---------- Layout de 2 columnas ---------- */
    .blend-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.72fr) minmax(0, 1fr);
      gap: 16px; align-items: start;
    }
    .blend-left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .blend-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: 84px; }

    /* ---------- Section header ---------- */
    .sec-head { display: flex; align-items: baseline; gap: 12px; padding: 0 2px; }
    .sec-title { font-size: 16px; font-weight: 700; letter-spacing: var(--letter-display); color: var(--text); }
    .sec-title .muted { color: var(--text-3); font-weight: 500; }
    .sec-note { margin-left: auto; font-size: 11px; color: var(--text-3); display: inline-flex; align-items: center; gap: 8px; }
    .sec-note .caret { color: var(--accent); }
    .legend-key { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-3); }
    .legend-sw { width: 16px; height: 8px; border-radius: 3px; }
    .sec-note .rule { width: 1px; height: 12px; background: var(--hairline-strong); }

    /* ---------- Ranking table ---------- */
    .table-card { overflow: hidden; }
    .lt-grid {
      display: grid;
      grid-template-columns:
        40px                    /* Pos */
        minmax(130px, 1.5fr)    /* Agencia */
        84px                    /* Índice de Salud */
        66px                    /* Tendencia */
        minmax(90px, 1fr)       /* Sentimiento */
        60px                    /* Riesgo */
        40px                    /* Velocidad */
        58px;                   /* Alcance */
      gap: 10px; align-items: center;
    }
    .lt-head { padding: 10px 18px; background: var(--canvas-2); border-bottom: 1px solid var(--hairline-strong); }
    .lt-head .th {
      font-size: 9.5px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.07em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .th.r { justify-content: flex-end; text-align: right; }
    .th.c { justify-content: center; }
    .th.active { color: var(--accent); }
    .th .caret { font-size: 9px; }

    .lt-row { padding: 0 18px; height: 54px; border-top: 1px solid var(--hairline); }
    .lt-row:first-of-type { border-top: none; }
    .tint-pos { background: color-mix(in oklab, var(--pos-bg) 45%, transparent); }
    .tint-neg { background: color-mix(in oklab, var(--neg-bg) 42%, transparent); }
    .lt-row.row-hover:hover { background: var(--canvas-2); }
    .lt-row.tint-pos.row-hover:hover { background: var(--pos-bg); }
    .lt-row.tint-neg.row-hover:hover { background: var(--neg-bg); }

    /* Pos cell */
    .pos-cell { display: flex; align-items: center; gap: 6px; }
    .pos-rank { font-size: 15px; font-weight: 700; color: var(--text); width: 16px; font-variant-numeric: tabular-nums; text-align: right; }
    .pos-delta { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Agencia cell */
    .ag-cell { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .ag-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .ag-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .ag-short { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ag-sector {
      font-size: 8.5px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; flex: none;
      border: 1px solid var(--hairline-strong); color: var(--text-3); background: var(--canvas);
      font-family: var(--ff-mono);
    }
    .ag-full { font-size: 10px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 15px; }

    /* Salud cell */
    .bhi-cell { display: flex; flex-direction: column; gap: 5px; }
    .bhi-top { display: flex; align-items: center; gap: 7px; }
    .bhi-num { font-size: 19px; font-weight: 600; line-height: 1; color: var(--text); }
    .bhi-pill { padding: 2px 6px; font-size: 9px; }
    .seg-bar { display: flex; gap: 2px; align-items: center; position: relative; height: 5px; }
    .seg { height: 5px; border-radius: 2px; flex: 1; background: color-mix(in oklab, var(--text-3) 22%, transparent); }
    .seg-mark { position: absolute; top: -2px; width: 3px; height: 9px; border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 1.5px var(--canvas); }

    /* Sentimiento cell */
    .nss-cell { display: flex; flex-direction: column; gap: 5px; }
    .nss-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .nss-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .nss-splits { font-size: 9px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .split-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in oklab, var(--text-3) 16%, transparent); }

    /* Riesgo cell */
    .risk-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .risk-num { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .risk-pill { padding: 2px 6px; font-size: 9px; }

    /* Velocidad cell */
    .vel-cell { text-align: center; }
    .vel-num { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .vel-hot { color: var(--neg); }

    /* Alcance cell */
    .reach-cell { text-align: right; }
    .reach-num { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
    .reach-sub { font-size: 8.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }

    /* ---------- Filas "En integración" ---------- */
    .lt-build {
      padding: 0 18px; min-height: 50px;
      border-top: 1px dashed var(--hairline-strong);
      background: repeating-linear-gradient(45deg, transparent, transparent 8px, color-mix(in oklab, var(--text-3) 5%, transparent) 8px, color-mix(in oklab, var(--text-3) 5%, transparent) 9px);
    }
    .lt-build:first-of-type { border-top: 1px dashed var(--hairline-strong); }
    .ag-dot-build { width: 8px; height: 8px; border-radius: 50%; flex: none; background: transparent; border: 1.5px dashed var(--text-3); }
    .ag-short-build { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .pill-build {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--warn); background: color-mix(in oklab, var(--warn) 10%, transparent);
      border: 1px dashed color-mix(in oklab, var(--warn) 55%, transparent);
      font-family: var(--ff-mono);
    }
    .pill-build .bdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
    .build-note {
      grid-column: 3 / -1; align-self: center;
      display: flex; align-items: center; gap: 9px;
      font-size: 11px; color: var(--text-3);
    }
    .build-note .dash { font-family: var(--ff-mono); color: var(--text-3); opacity: .55; letter-spacing: .3em; }
    .build-note .recop { display: inline-flex; align-items: center; gap: 6px; font-style: italic; }
    .build-note .recop svg { width: 12px; height: 12px; opacity: .7; }

    /* ---------- Riel derecho ---------- */
    .rail-card { display: flex; flex-direction: column; overflow: hidden; }
    .rail-hd {
      display: flex; align-items: center; gap: 9px;
      padding: 12px 15px; border-bottom: 1px solid var(--hairline);
    }
    .rail-hd .hd-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .rail-hd-title { font-family: var(--ff-display); font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); flex: 1; }
    .rail-hd-sub { font-size: 9px; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; font-family: var(--ff-mono); }

    /* Requiere atención */
    .attn-card {
      border-color: color-mix(in oklab, var(--accent) 45%, transparent) !important;
      box-shadow: var(--shadow-sm), 0 0 0 1px var(--accent-fill);
      background: linear-gradient(180deg, var(--accent-fill), transparent 34%), var(--canvas);
    }
    .attn-card .rail-hd { border-bottom: 1px solid color-mix(in oklab, var(--accent) 26%, transparent); }
    .attn-card .rail-hd .hd-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .attn-row {
      position: relative; padding: 12px 15px;
      border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 7px;
    }
    .attn-row:first-of-type { border-top: 0; }
    .attn-row.is-crisis { background: linear-gradient(90deg, var(--neg-bg), transparent 72%); }
    .attn-row.is-crisis::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--neg); }
    .attn-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .attn-head-l { display: flex; align-items: center; gap: 8px; }
    .attn-agency { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-2); }
    .attn-sev .pill { font-size: 9px; padding: 3px 7px; gap: 5px; }
    .sev-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .attn-title { font-size: 13px; font-weight: 600; line-height: 1.32; color: var(--text); }
    .attn-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .attn-metric { font-family: var(--ff-mono); font-size: 10.5px; color: var(--text-2); min-width: 0; }
    .attend {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 3px; background: var(--accent); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .03em; border: 1px solid var(--accent);
    }
    .attend svg { width: 11px; height: 11px; }

    /* Olas temáticas */
    .theme-row { padding: 12px 15px; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 7px; }
    .theme-row:first-of-type { border-top: 0; }
    .theme-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .theme-label { font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.25; }
    .theme-meta { display: flex; align-items: baseline; gap: 9px; flex-shrink: 0; }
    .theme-vol { font-family: var(--ff-mono); font-size: 11px; color: var(--text-3); }
    .theme-nss { font-family: var(--ff-numeric); font-size: 13px; font-weight: 600; }
    .theme-bar-track { height: 4px; border-radius: 1px; background: color-mix(in oklab, var(--text-3) 18%, transparent); overflow: hidden; }
    .theme-bar { height: 100%; border-radius: 1px; }
    .theme-agencies { font-size: 9.5px; color: var(--text-3); font-family: var(--ff-mono); letter-spacing: .02em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    (function () {
      const M = window.MOCK;
      const G = M.gov;
      const F = M.fmt;

      const hsl = (a, l) => `hsl(${a.hue} 52% ${l}%)`;
      const sectorAbbr = { 'Económico': 'ECON', 'Social': 'SOCIAL', 'Infraestructura': 'INFRA', 'Seguridad': 'SEGUR' };

      // ---- sparkline ----
      function sparkSVG(arr, w, h, color) {
        const s = M.spark(arr, w, h, 3);
        return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">
          <path d="${s.area}" fill="${color}" opacity="0.10"/>
          <path d="${s.line}" stroke="${color}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="${s.last[0].toFixed(1)}" cy="${s.last[1].toFixed(1)}" r="2.3" fill="${color}" stroke="var(--canvas)" stroke-width="1.2"/>
        </svg>`;
      }

      function rankDeltaHTML(d) {
        if (d > 0) return `<span class="pos-delta" style="color:var(--pos)">▲${d}</span>`;
        if (d < 0) return `<span class="pos-delta" style="color:var(--neg)">▼${Math.abs(d)}</span>`;
        return `<span class="pos-delta" style="color:var(--text-3)">—</span>`;
      }

      /* ============================================================
         1) FILA DE MODOS
         ============================================================ */
      const modeIcon = {
        resumen: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/>',
        tabla: '<path d="M3 6h18M3 12h18M3 18h18"/>',
        gabinete: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 21v-2a4 4 0 0 0-3-3.85"/>',
        matriz: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
        radar: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
      };
      const glyph = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${modeIcon[n]}</svg>`;
      const MODES = [
        { key: 'resumen', label: 'Resumen ejecutivo', active: true },
        { key: 'tabla', label: 'Tabla de posiciones' },
        { key: 'gabinete', label: 'Gabinete' },
        { key: 'matriz', label: 'Matriz' },
        { key: 'radar', label: 'Radar de crisis' },
      ];
      const modeRow = `
        <div class="mode-row">
          <div class="mode-seg">
            ${MODES.map((m) => `<button class="mode-chip${m.active ? ' active' : ''}">${glyph(m.key)}<span>${m.label}</span></button>`).join('')}
          </div>
          <div class="mode-note">
            <span>Vista consolidada de <b>${G.agenciesTracked} agencias</b></span>
            <span class="rule"></span>
            <span>semana cerrada · actualizado <b>6:00 AM AST</b></span>
          </div>
        </div>`;

      /* ============================================================
         2) TIRA DE KPIs DEL GOBIERNO
         ============================================================ */
      const govCB = M.crisisBand(G.crisis);       // ALERTA
      const govBB = M.bhiBand(G.bhi);             // Débil
      const kSpark = (arr, color) => sparkSVG(arr, 78, 28, color);
      // menciones: serie suave ascendente derivada de crisisTrend (vol ↑ durante alerta)
      const volSeries = G.crisisTrend.map((v) => v * 100);

      const stats = `
        <div class="stat-strip">
          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Índice de Salud</span>
              <span class="stat-delta" style="color:var(--neg)">▼ ${F.signed(G.bhiDelta)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num">${G.bhi}</span>
              ${kSpark(G.trend, 'var(--accent)')}
            </div>
            <div class="stat-sub">Compuesto ponderado · banda ${govBB.label}</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Sentimiento Neto</span>
              <span class="stat-delta" style="color:var(--neg)">▼ ${F.signed(G.nssDelta)}</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num" style="color:var(--neg)">${F.signed(G.nss)}</span>
              ${kSpark(G.nssTrend, 'var(--neg)')}
            </div>
            <div class="stat-sub">${G.positivePct}% pos · ${G.neutralPct}% neu · ${G.negativePct}% neg</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Riesgo de Crisis</span>
              <span class="pill ${govCB.cls}">${govCB.label}</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num" style="color:var(--neg)">${G.crisis.toFixed(2)}</span>
              <span class="stat-delta" style="color:var(--neg)">▲ ${F.signed(G.crisisDelta, 2)}</span>
            </div>
            <div class="stat-sub">${G.inCrisis} en crisis · ${G.inAlert} en alerta</div>
          </div>

          <div class="card stat">
            <div class="stat-top">
              <span class="stat-label">Menciones · 7 días</span>
              <span class="stat-delta" style="color:var(--text-2)">▲ +${G.volDelta}%</span>
            </div>
            <div class="stat-row">
              <span class="stat-num num">${F.compact(G.vol)}</span>
              ${kSpark(volSeries, 'var(--text-2)')}
            </div>
            <div class="stat-sub">Alcance ${F.compact(G.reach)} personas</div>
          </div>
        </div>`;

      /* ============================================================
         3) IZQUIERDA — RANKING
         ============================================================ */
      const secHead = `
        <div class="sec-head">
          <div class="sec-title">Ranking de salud digital <span class="muted">· ${G.agenciesTracked} agencias</span></div>
          <div class="sec-note">
            <span class="legend-key"><span class="legend-sw" style="background:var(--pos)"></span>Pos</span>
            <span class="legend-key"><span class="legend-sw" style="background:var(--text-3)"></span>Neu</span>
            <span class="legend-key"><span class="legend-sw" style="background:var(--neg)"></span>Neg</span>
            <span class="rule"></span>
            ordenado por <b style="color:var(--text-2);font-weight:600">Índice de Salud</b> <span class="caret">▾</span>
          </div>
        </div>`;

      const tableHead = `
        <div class="lt-grid lt-head">
          <span class="th">Pos</span>
          <span class="th">Agencia</span>
          <span class="th active">Índice <span class="caret">▾</span></span>
          <span class="th c">Tend. 14&nbsp;sem</span>
          <span class="th">Sentimiento</span>
          <span class="th r">Riesgo</span>
          <span class="th c">Vel.</span>
          <span class="th r">Alcance</span>
        </div>`;

      const sorted = M.agencies.slice().sort((a, b) => b.bhi - a.bhi);
      const N = sorted.length;
      const segLabels = ['Crítico', 'Débil', 'Sano', 'Fuerte'];
      const segColors = ['var(--neg)', 'var(--warn)', 'var(--pos)', 'var(--accent)'];

      const rows = sorted.map(function (a, idx) {
        const pos = idx + 1;
        const bb = M.bhiBand(a.bhi);
        const cb = M.crisisBand(a.crisis);
        const dotC = hsl(a, 52);

        let tint = '';
        if (pos <= 2) tint = ' tint-pos';
        else if (pos >= N - 2) tint = ' tint-neg';

        const segIndex = a.bhi < 40 ? 0 : a.bhi < 60 ? 1 : a.bhi < 80 ? 2 : 3;
        const segs = segLabels.map(function (_, si) {
          const on = si === segIndex;
          return `<span class="seg" style="${on ? 'background:' + segColors[si] : ''}"></span>`;
        }).join('');
        const markPct = Math.min(Math.max(a.bhi, 0), 100);

        const splitBar = `<div class="split-bar">
            <div style="flex-grow:${a.pos};background:var(--pos)"></div>
            <div style="flex-grow:${a.neu};background:var(--text-3)"></div>
            <div style="flex-grow:${a.neg};background:var(--neg)"></div>
          </div>`;
        const nssC = a.nss > 0 ? 'var(--pos)' : a.nss < 0 ? 'var(--neg)' : 'var(--text-2)';
        const velHot = a.engVel >= 2.0 ? ' vel-hot' : '';

        return `
        <div class="lt-grid lt-row row-hover${tint}">
          <div class="pos-cell">
            <span class="pos-rank num">${pos}</span>
            ${rankDeltaHTML(a.rankDelta)}
          </div>
          <div class="ag-cell">
            <div class="ag-top">
              <span class="ag-dot" style="background:${dotC}"></span>
              <span class="ag-short">${a.short}</span>
              <span class="ag-sector">${sectorAbbr[a.sector] || a.sector}</span>
            </div>
            <div class="ag-full">${a.name}</div>
          </div>
          <div class="bhi-cell">
            <div class="bhi-top">
              <span class="bhi-num num">${a.bhi}</span>
              <span class="pill ${bb.cls} bhi-pill">${bb.label}</span>
            </div>
            <div class="seg-bar">
              ${segs}
              <span class="seg-mark" style="left:${markPct}%;background:${bb.color}"></span>
            </div>
          </div>
          <div>${sparkSVG(a.trend, 62, 30, bb.color)}</div>
          <div class="nss-cell">
            <div class="nss-top">
              <span class="nss-val" style="color:${nssC}">${F.signed(a.nss)}</span>
              <span class="nss-splits">${a.pos}/${a.neu}/${a.neg}</span>
            </div>
            ${splitBar}
          </div>
          <div class="risk-cell">
            <span class="risk-num num" style="color:${cb.color}">${a.crisis.toFixed(2)}</span>
            <span class="pill ${cb.cls} risk-pill">${cb.label}</span>
          </div>
          <div class="vel-cell">
            <span class="vel-num num${velHot}">${a.engVel.toFixed(1)}×</span>
          </div>
          <div class="reach-cell">
            <div class="reach-num num">${F.compact(a.reach)}</div>
            <div class="reach-sub num">${F.compact(a.vol)} menc.</div>
          </div>
        </div>`;
      }).join('');

      // ---- Filas "En integración" (placeholder inline, no en data.js) ----
      const building = [
        { name: 'Departamento de Hacienda', short: 'Hacienda', sector: 'Económico', state: 'building' },
        { name: 'Departamento de Corrección y Rehabilitación', short: 'DCR', sector: 'Seguridad', state: 'building' },
      ];
      const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
      const buildRows = building.map(function (b) {
        return `
        <div class="lt-grid lt-build">
          <div class="pos-cell"><span class="pos-rank" style="color:var(--text-3);font-weight:600">—</span></div>
          <div class="ag-cell">
            <div class="ag-top">
              <span class="ag-dot-build"></span>
              <span class="ag-short-build">${b.short}</span>
              <span class="ag-sector">${sectorAbbr[b.sector] || b.sector}</span>
              <span class="pill-build"><span class="bdot pulse"></span>En integración</span>
            </div>
            <div class="ag-full">${b.name}</div>
          </div>
          <div class="build-note">
            <span class="dash">— — — —</span>
            <span class="recop">${clockIcon}Recopilando data…</span>
          </div>
        </div>`;
      }).join('');

      const table = `<div class="card table-card">${tableHead}${rows}${buildRows}</div>`;

      /* ============================================================
         DERECHA — RIEL: "Requiere atención" + "Olas temáticas"
         ============================================================ */
      const sevMeta = {
        crisis: { cls: 'pill-neg', label: 'CRISIS', color: 'var(--neg)' },
        alerta: { cls: 'pill-neg', label: 'ALERTA', color: 'var(--neg)' },
      };
      const atIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`;

      const attnItems = M.feed.filter((f) => f.sev === 'crisis' || f.sev === 'alerta');
      const attnRows = attnItems.map(function (f) {
        const a = M.byKey(f.agency);
        const sm = sevMeta[f.sev];
        const isCrisis = f.sev === 'crisis';
        return `
        <div class="attn-row ${isCrisis ? 'is-crisis' : ''} row-hover">
          <div class="attn-head">
            <div class="attn-head-l">
              <span class="attn-sev"><span class="pill ${sm.cls}"><span class="sev-dot${isCrisis ? ' pulse' : ''}" style="background:${sm.color}"></span>${sm.label}</span></span>
              <span class="attn-agency">${a.short}</span>
            </div>
            <span class="theme-vol">${f.t}</span>
          </div>
          <div class="attn-title">${f.title}</div>
          <div class="attn-foot">
            <span class="attn-metric">${f.metric} · ${F.compact(f.reach)} alcance</span>
            <button class="attend">Atender ${atIcon}</button>
          </div>
        </div>`;
      }).join('');

      const attnCard = `
        <div class="card rail-card attn-card">
          <div class="rail-hd">
            <span class="hd-dot"></span>
            <span class="rail-hd-title">Requiere atención</span>
            <span class="rail-hd-sub">${attnItems.length} activos</span>
          </div>
          ${attnRows}
        </div>`;

      const topThemes = M.themes.slice().sort((a, b) => b.vol - a.vol).slice(0, 4);
      const themeRows = topThemes.map(function (t) {
        const cb = M.crisisBand(t.crisis);
        const nssC = t.nss > 0 ? 'var(--pos)' : 'var(--neg)';
        return `
        <div class="theme-row">
          <div class="theme-top">
            <span class="theme-label">${t.label}</span>
            <span class="theme-meta">
              <span class="theme-vol">${F.compact(t.vol)}</span>
              <span class="theme-nss" style="color:${nssC}">${F.signed(t.nss)}</span>
            </span>
          </div>
          <div class="theme-bar-track">
            <div class="theme-bar" style="width:${Math.min(t.crisis * 100, 100)}%;background:${cb.color}"></div>
          </div>
          <div class="theme-agencies">${t.agencies.map((k) => (M.byKey(k) ? M.byKey(k).short : k)).join(' · ')}</div>
        </div>`;
      }).join('');

      const themesCard = `
        <div class="card rail-card">
          <div class="rail-hd">
            <span class="hd-dot" style="background:var(--text-3)"></span>
            <span class="rail-hd-title">Olas temáticas</span>
            <span class="rail-hd-sub">vol ↓</span>
          </div>
          ${themeRows}
        </div>`;

      const mainGrid = `
        <div class="blend-grid">
          <div class="blend-left">${secHead}${table}</div>
          <div class="blend-right">${attnCard}${themesCard}</div>
        </div>`;

      /* ============================================================
         MOUNT — shell frame
         ============================================================ */
      const content = modeRow + stats + mainGrid;
      document.getElementById('app').innerHTML = ECOShell.frame({
        active: 'gobierno',
        title: 'Resumen ejecutivo',
        eyebrow: 'Vista Ejecutiva · Multi-agencia',
        period: '7D',
        content,
      });
    })();
  </script>
</body>
</html>
