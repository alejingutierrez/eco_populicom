<!DOCTYPE html>
<html lang="es" data-theme="mando" data-mode="light">
<head>
<meta charset="UTF-8" />
<script>
  // Modo ANTES del primer pintado (sin destello). Claro por defecto
  // («Instrumento», sep-2026). Se lee `eco.mode.v2` y NO `eco.mode`: la app
  // guardaba `eco.mode` en cada carga, así que todo usuario existente tenía
  // 'dark' persistido sin haberlo elegido. La clave nueva solo existe si la
  // persona cambió el modo a mano después de la migración.
  try {
    var m = localStorage.getItem('eco.mode.v2');
    if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-mode', m);
  } catch (_) {}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ECO - Escucha Ciudadana Online</title>
<link rel="icon" type="image/svg+xml" href="/eco-prototype/icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- Capa de tokens del sistema de diseño — fuente única de verdad.
     Ver /design-system/index.html para el especimen vivo. -->
<link rel="stylesheet" href="/eco-prototype/tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  /* :root — tipografía, espaciado, radios y movimiento viven ahora en
     tokens.css. No re-declares aquí: si falta un token, añádelo allá. */

    
    
  /* ============================================== */
  /* THEME: MANDO (command center)                  */
  /* ============================================== */
  /* Tema MANDO (claro + oscuro) — definido en tokens.css, con las correcciones
   de contraste AA (--text-3 2.65:1 → 5.00:1) y la separación --accent / --neg.
   Los temas COSTA y GACETA de arriba siguen aquí porque no son alcanzables
   por el usuario en producción (app.js fija mando/dark); el plan de
   auditoría recomienda retirarlos. */

* { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--ff-sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.3s var(--ease), color 0.3s var(--ease);
  }
  body { font-family: var(--ff-sans); }

  /* `font-size: inherit` cierra un hueco real: un <button> sin tamaño propio caía
   * al default del navegador (13.333px en Chrome), un valor que no está en la
   * escala y que nadie eligió. Heredar lo mete en la escala por defecto. */
  button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }

  /* Cifras tabulares en TODA tabla. Sin esto los dígitos de Krub/Besley tienen
   * anchos distintos (el 1 es más angosto que el 8), así que al cambiar de
   * período las columnas de números se corren de fila en fila. Aquí es donde
   * pertenecen las cifras de ancho fijo: 183 celdas numéricas no las tenían. */
  table { font-variant-numeric: tabular-nums lining-nums; }
  input, select { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

  /* ===========================================================================
     Objetivo mínimo de 24x24 (WCAG 2.2 AA, SC 2.5.8). Aplica con ratón también,
     así que va SIN media query. `:where()` tiene especificidad cero: sube el
     piso sin ganarle a ninguna regla existente.
     Nota de umbrales: 44x44 es WCAG 2.1 AAA (SC 2.5.5), no AA — el objetivo
     declarado del proyecto es AA, y en táctil se sube a 44 más abajo.
     ======================================================================== */
  :where(button, [role="button"], select, textarea, summary, .btn-chip) {
    min-height: 24px;
  }
  /* Los enlaces de atribución de Leaflet son markup de terceros y salen a 14px.
     Se suben al mínimo sin tocar su tamaño de letra. */
  .leaflet-control-attribution a { display: inline-flex; align-items: center; min-height: 24px; }
  /* Un input sin la clase .input (p.ej. un range) también necesita piso. */
  :where(input:not([type="checkbox"]):not([type="radio"])) { min-height: 24px; }
  input[type="range"] { min-height: 24px; }

  /* Un <a> en flujo inline ignora min-height: necesita ser caja. */
  :where(a.link, a[href].chip, a[href].btn) {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
  }


  /* ===========================================================================
     Áreas táctiles (WS-A2). Se enganchan a `pointer: coarse`, NO al ancho: una
     tablet de 1024px se toca con el dedo igual que un teléfono. Antes las
     reglas vivían bajo `max-width: 768px` y apuntaban a 40/34px, por debajo del
     mínimo de 44.
     ======================================================================== */
  @media (pointer: coarse) {
    .btn, .chip, .btn-chip, .input, select, textarea, input[type="date"] { min-height: 44px; }
    /* `.touch-target` expande el área SIN cambiar el tamaño visual: para los
       controles densos (chips de serie, iconos de fila) donde estirar a 44px
       rompería la retícula. */
    .touch-target { position: relative; }
    .touch-target::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: max(100%, 44px);
      height: max(100%, 44px);
      transform: translate(-50%, -50%);
    }
  }

  /* Celda de heatmap: el hover con transform:scale(1.4) inline se movió a CSS
     para tener también :focus-visible (era hover-only, inalcanzable sin ratón). */
  .eco-heat-cell { transition: transform var(--dur-fast) var(--ease), outline-color var(--dur-fast) var(--ease); outline: 2px solid transparent; }
  .eco-heat-cell:hover, .eco-heat-cell:focus-visible { transform: scale(1.4); outline-color: var(--accent); z-index: 10; }
  @media (pointer: coarse) { .eco-heat-cell:active { transform: scale(1.25); outline-color: var(--accent); z-index: 10; } }

  /* utility */
  .num { font-family: var(--ff-numeric); font-variant-numeric: tabular-nums lining-nums; font-feature-settings: 'tnum' 1, 'lnum' 1; letter-spacing: var(--letter-display, -0.005em); }
  .mono { font-family: var(--ff-mono); }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 20px; height: 20px; padding: 0 5px;
    font-family: var(--ff-mono); font-size: var(--fs-caption); font-weight: 500;
    background: var(--canvas-2); border: 1px solid var(--hairline);
    border-radius: 4px; color: var(--text-2);
  }

  /* focus */
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--action);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* App layout */
  .eco-app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
    background: var(--bg);
  }
  .eco-app[data-collapsed="true"] { grid-template-columns: 64px 1fr; }

  .eco-main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    /* No global horizontal scroll: content REFLOWS instead of being force-
       widened. Genuinely wide widgets (data tables, streamgraph) get their
       own .scroll-x wrapper. This is the hard stop that keeps the page body
       from ever scrolling sideways — the old min-width "scroll guards" that
       forced 900/1120px are gone. */
    overflow-x: hidden;
  }

  .eco-page {
    padding: 20px var(--gutter-page) 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
    max-width: 100%;
  }

  /* Sidebar identity — lets the mobile media query override the inline
     position:sticky to turn the rail into an off-canvas drawer. */
  .eco-sidebar { min-width: 0; }

  /* Off-canvas nav backdrop. Defined OUTSIDE the mobile media query so it is
     never an in-flow grid item: if the viewport crosses to desktop while the
     drawer is still open (before React unmounts it), a media-query-scoped rule
     would drop position:fixed and the div would displace .eco-main for a frame.
     It only ever renders when menuOpen is true, which only happens on mobile. */
  .eco-menu-backdrop {
    position: fixed; inset: 0; z-index: 2040;
    background: rgba(0,0,0,0.5);
    animation: fadeIn 0.2s var(--ease);
  }

  /* Reusable horizontal-scroll container for genuinely wide widgets. Scroll
     stays INSIDE the widget, never the page. */
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; min-width: 0; }

  /* Responsive visibility helpers. */
  .show-mobile { display: none !important; }
  /* Complemento de `.show-mobile`, que existía sin su par: una fila de
     encabezados de tabla no cabe en 390px, pero su ausencia deja la columna sin
     nombre. Se muestra donde hay sitio y en móvil la fila se pliega a dos líneas
     con el rótulo dentro de cada celda. */
  .hide-mobile { display: initial; }

  /* Truncado de una línea. Estaba escrito a mano como tres propiedades inline en
     18 sitios de screens.js, y donde faltaba UNA el texto no se acortaba: se
     cortaba en seco contra el `overflow:hidden` del padre, porque `text-overflow`
     no se hereda aunque `white-space` sí. Así se leía "facebook.co" en la tabla de
     menciones destacadas. Un corte con puntos suspensivos dice "hay más"; un corte
     a hueso se lee como el dato completo, y un dominio recortado es un dominio
     FALSO. `min-width:0` va incluido porque sin él un item de flex/grid no cede y
     no llega a truncar nunca. */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* Tablet: auto-collapse the rail to an icon column to reclaim width. Paired
     in JS with collapsed=true so labels don't clip. */
  @media (max-width: 1024px) {
    .eco-app { grid-template-columns: 64px 1fr; }
  }

  /* Mobile: sidebar leaves the grid and becomes an off-canvas drawer; content
     spans the full viewport width. */
  @media (max-width: 768px) {
    .eco-app { grid-template-columns: 1fr; }
    .eco-app[data-collapsed="true"] { grid-template-columns: 1fr; }
    .eco-sidebar {
      position: fixed !important;
      top: 0; left: 0; bottom: 0;
      width: min(84vw, 288px) !important;
      height: 100dvh !important;
      overflow-y: auto !important;
      z-index: 2050;
      transform: translateX(-100%);
      transition: transform 0.26s var(--ease);
      box-shadow: 0 0 40px rgba(0,0,0,0.45);
    }
    .eco-app[data-menu-open="true"] .eco-sidebar { transform: translateX(0); }
    :root { --gutter-page: 12px; }
    .eco-page { padding: 14px var(--gutter-page) 36px; }
    .show-mobile { display: inline-flex !important; }
    .eco-search-btn { min-width: 0 !important; }
    /* Header en dos filas: [menú · título · acciones] y [período a lo ancho].
       Antes eran tres, con las acciones solas en la tercera. */
    .eco-header-title { flex: 1 1 0 !important; }
    .eco-header-period { order: 5; flex: 1 1 100% !important; }
    .eco-header-period .eco-seg { flex: 1; }
    .eco-header-period .eco-seg > button { flex: 1; }
    /* En el drawer los ítems del rail llegan al objetivo táctil de 44px. */
    .eco-sidebar .eco-rail-item { height: auto !important; min-height: 44px; }
    .hide-mobile { display: none !important; }
    .hide-mobile { display: none !important; }
    /* Larger tap targets on touch screens. */
    .btn { min-height: 44px; }
    select, input[type="date"], .input, textarea { min-height: 44px; }
    /* Header date-range popover: pin to the viewport so it can't be clipped
       off-screen when the header controls wrap (the absolute right:0 anchor
       would otherwise hang past the left edge under overflow-x:hidden). */
    .eco-datepop {
      position: fixed !important;
      left: 12px !important; right: 12px !important;
      top: 72px !important;
      width: auto !important; min-width: 0 !important;
      z-index: 100;
    }
  }

  /* Card primitive */
  .card {
    /* El `border-radius: 6px` que había aquí era código muerto: tres líneas más
       abajo `var(--r-lg)` (10px) lo pisaba. Un crudo que NO se aplica es peor que
       uno que sí: quien lee el primitivo cree que la card tiene 6 de radio. */
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    /* Allow cards to shrink inside grid/flex tracks (min-width:auto default
       otherwise lets wide inner content force horizontal overflow). */
    min-width: 0;
  }

  .card-hd {
    padding: 14px 16px 10px;
    display: flex;
    align-items: center;
    /* `flex-wrap` es lo que impide que el título y los controles se peleen el
       mismo renglón. Sin él, `.card-hd > div:first-child` (flex:1, min-width:0)
       se comprimía a ~55px mientras los 6 chips de series no cedían nada: el
       subtítulo de "Evolución multi-métrica" caía en once líneas de una palabra y
       el punto del chip "NSS" quedaba ENCIMA de la palabra "hasta". Con wrap los
       controles bajan enteros a su propia línea y el `gap` ya separa las dos. */
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--hairline);
  }
  /* `flex: 1 1 60%`, no `flex: 1`. El atajo `flex: 1` es `1 1 0%`: con base CERO
     el bloque del título nunca supera el ancho de la línea, así que nunca fuerza
     el salto que `flex-wrap` habilita — se comprimía a ~55px mientras los
     controles no cedían nada. Con una base del 60% el título reclama su mitad y,
     cuando no cabe con los controles, los empuja a su propia línea. */
  .card-hd > div:first-child { min-width: 0; flex: 1 1 60%; }

  /* --- CORTES RESPONSIVE — sólo DOS, y son los de ecoUseBreakpoint() ----------
     768px   → 'mobile'   (una columna, objetivos táctiles de 44px)
     1024px  → 'tablet'   (rejillas reducidas, drawer a pantalla completa)
     >1024px → 'desktop'
     Las media queries de CSS no pueden leer custom properties, así que el único
     modo de que no vuelvan a derivar es que estén enumerados aquí y que cualquier
     corte nuevo tenga que justificarse contra esta lista. Un `max-width` de
     CONTENIDO (por ejemplo el de 740px del resumen de narrativa) no es un corte:
     no cambia la maqueta, sólo limita la medida de una línea de texto.
     ------------------------------------------------------------------------- */
  .card-hd-title { font-family: var(--ff-display); font-size: var(--fs-title-md); font-weight: var(--fw-semibold); color: var(--text); text-transform: none; letter-spacing: var(--tracking-tight); }
  /* 12px, no 11: --fs-overline sólo cubre eyebrows en mayúsculas y ticks de eje
     (tokens.css §1) y este subtítulo es prosa en minúsculas — es justo donde vive
     la metodología que el cliente pregunta en la reunión ("cada mención cuenta
     una vez bajo su tópico de mayor confianza"). En móvil ocupa dos líneas. */
  .card-hd-sub { font-size: var(--fs-caption); color: var(--text-3); margin-top: var(--sp-05); }
  .card-bd { padding: var(--pad-card); }
  .card-bd-flush { padding: 0; }

  /* Pill */
  .pill {
    /* Este bloque declaraba tres propiedades DOS veces y ganaba siempre la
       segunda: `border-radius: 3px` → `999px`, `padding: 4px 8px` → `3px 8px`,
       `font-size: 11px` → `11px`. La mitad del bloque era documentación falsa
       —describía un rectángulo de 4px de radio que la píldora nunca fue— y
       cualquiera que ajustara la primera mitad no vería ningún cambio. Quedan
       sólo las declaraciones vivas, y con token: el tamaño ES el overline
       (11px en mayúsculas) y el radio ES la píldora.
       Dos literales se quedan a propósito. `letter-spacing: 0.04em` no es el
       eyebrow de sección (--tracking-overline: 0.09em) sino texto dentro de una
       caja con 8px de padding que vive en columnas de tabla de ancho fijo:
       subirlo ensancharía TODAS las píldoras del producto. Y los 3px verticales
       no tienen token (la escala salta 2→4) y cambiarlos movería el alto de la
       píldora, que comparte fila con celdas de 30px de avatar. */
    display: inline-flex;
    align-items: center;
    gap: var(--sp-15);
    /* «Instrumento»: el juicio del dato en tipo oración, radio chico y relleno
       tenue. Las mayúsculas espaciadas eran del eyebrow, no del dato. */
    padding: 3px 9px;
    border-radius: var(--r-sm);
    font-family: var(--ff-sans);
    font-size: var(--fs-label);
    font-weight: var(--fw-semibold);
    line-height: 1.25;
    white-space: nowrap;
  }

  .pill-pos { background: var(--pos-bg); color: var(--pos); }
  .pill-neg { background: var(--neg-bg); color: var(--neg); }
  /* pill-neu must read as classified, not as "empty". In dark mode the old
     canvas-2 background blended into cards and looked unclassified. */
  .pill-neu { background: var(--neu-bg); color: var(--neu); }
  .pill-warn { background: var(--warn-bg); color: var(--warn); }
  /* 'info' pintada con el naranja de marca era el bug: --accent-fill + --accent
     es el tratamiento del ESTADO de interacción (chip activo, término
     seleccionado, página actual, coincidencia de búsqueda). Una pill que informa
     de un ATRIBUTO del dato ('nuevo', 'datos cacheados') compartía tratamiento
     exacto con 'seleccionado' dentro del mismo componente. --info/--info-bg ya
     existían y estaban libres (#58A6FF, 7.22:1 sobre --canvas). */
  .pill-info { background: var(--info-bg); color: var(--info); }
  /* Fallback for unexpected sentiment values (should never hit in prod given
     the DB constraint, but surfaces gracefully if it does). */
  .pill-unknown {
    background: repeating-linear-gradient(45deg, var(--canvas-2) 0 4px, transparent 4px 8px);
    color: var(--text-3);
    border: 1px dashed var(--hairline-strong);
  }

  /* Una píldora puede llevar un NOMBRE (estado de cuenta, rol, permiso) en vez
     de un valor de enum. Ahí la caja alta del primitivo miente: «Invitación
     pendiente» no es una sigla, y en mayúsculas mide ~146px con el
     `white-space: nowrap` de `.pill`, así que el texto se salía de su propio
     fondo y se montaba sobre la columna vecina de la tabla de Usuarios. La
     clase ya se referenciaba dos veces en screens.js (tabla y UserRowCard) y
     NUNCA se declaró: era una clase muerta, o sea que el uppercase seguía
     aplicándose y nadie veía el opt-out que el marcado pedía. La caja alta se
     queda para los enums (positivo/negativo, alta/media), que es donde
     distingue código de prosa. */
  .pill-name { text-transform: none; letter-spacing: var(--tracking-normal); }

  /* Chip button */
  .chip {
    /* El `border-radius: 3px` que había aquí era código muerto: la línea
       siguiente lo pisaba con 999px. El chip es el control más repetido de
       /search (facetas, tópicos, recientes, limpiar), así que pasa a moverse con
       los tokens en vez de con cinco literales. */
    display: inline-flex; align-items: center; gap: var(--sp-15);
    /* El chip es un control de BARRA (una pastilla), y tokens.css §3b declara
       --control-h como la altura exterior ÚNICA de esos: botón, input, select,
       pastilla, bolsa de período. Era el único primitivo que no la leía: su alto
       salía del padding (~26px) y en la fila de filtros de Geografía la pastilla
       "Limpiar" quedaba 6px más baja que los tres selects con los que comparte
       renglón — el mismo escalón de bordes que shell.js:654 ya había tapado a
       mano para el header ("era el control más bajo, 26px contra 38"). min-height
       y no height, igual que `.btn`, para que un chip con rótulo largo crezca en
       vez de recortarse. En táctil el token ya vale 44px (tokens.css:640), así
       que el objetivo de toque se cumple sin una regla aparte. Y 5/10px no están
       en la escala base-4: el mapa de migración los manda a --sp-15 / --sp-3. */
    padding: var(--sp-1) var(--sp-3); min-height: var(--control-h-sm);
    border-radius: var(--r-md);
    /* --fs-caption (12px), no --fs-overline (11px). El token declara que bajo 12px
       sólo caben dos cosas: eyebrows en mayúsculas y ticks de eje densos. Un chip
       lleva el NOMBRE de un tópico, de una faceta o de un filtro — es contenido en
       minúsculas, no una etiqueta de sección. Medido: el 11px se había vuelto el
       tamaño dominante de varias pantallas (70% del texto en Tópicos, 52% en el
       Scorecard), o sea la excepción convertida en regla, y con todo el cuerpo
       comprimido entre 11 y 12px la jerarquía interna de cada fila era un solo
       paso de 1px. El chip es el control más repetido del producto. */
    font-size: var(--fs-caption); font-weight: var(--fw-medium);
    /* El chip se rellenaba con el MISMO color que la card que lo contiene, así
       que los 8 chips de tópicos se leían como contornos fantasma a 1.15:1. */
    background: var(--control-bg); border: 1px solid var(--hairline-strong);
    color: var(--text-2);
    transition: all 0.15s var(--ease);
  }
  .chip:hover { border-color: var(--hairline-strong); color: var(--text); }
  /* Un chip es un SELECTOR (filtro, modo, pestaña): en las 17 veces que aparece
     `.chip.active` en screens.js no hay ni una acción primaria. Con el relleno
     --accent y --on-accent era indistinguible de `.btn-primary`, y en el hero del
     Scorecard "Señal del día" (chip activo) queda pegado a "Ver menciones" (botón
     primario): dos primarios iguales, uno navega y otro selecciona. Seleccionado
     = borde y texto del accent sobre relleno tenue (5.35:1 en oscuro, 4.58:1 en
     claro). El relleno saturado queda para la acción, que es una por vista. */
  /* Táctil: el chip sube a 44px. Va DESPUÉS de .chip porque aquí .chip fija su
     propio min-height (--control-h-sm) y le ganaba a la regla táctil de arriba. */
  @media (pointer: coarse) { .chip { min-height: 44px; } }
  /* Seleccionado ≠ acción. El relleno grafito sólido es del botón primario; un
     chip seleccionado lleva contorno de 2px (1 de borde + 1 de sombra interior)
     y relleno tenue. Con relleno sólido «Señal del día» (chip) quedaba idéntico
     a «Ver menciones» (botón) a 20px de distancia: el mismo defecto que ya se
     había corregido con el naranja. Contorno 18:1 contra el chip (SC 1.4.11). */
  .chip.active { background: var(--action-fill); border-color: var(--action); box-shadow: inset 0 0 0 1px var(--action); color: var(--text); font-weight: 600; }

  /* Grupo de chips que forman UN control (criterio, vista, orden, sentimiento).
     terms-cloud.js usaba la clase `.toggle-group` que NUNCA existió en el CSS:
     sin regla el div no era flex y sus dos cápsulas de radio 999px quedaban a
     0px, tocándose. El gap es el mismo --sp-15 que ViewToggle y los chips de
     sentimiento ya escribían a mano; ahora los cuatro grupos de la pantalla lo
     leen de un solo sitio en vez de declarar 0, 4 y 6px cada uno. */
  .toggle-group {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-15);
    flex-wrap: wrap;
  }

  /* Button */
  .btn {
    border-radius: 4px;
    font-size: 13px;
    font-family: var(--ff-sans);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    /* min-height (no height) para que un botón con texto largo pueda crecer: la
       altura de control sólo pone el PISO, que es lo que estaba desalineado —
       el botón con texto medía 32 y el de sólo icono 30. */
    min-height: var(--control-h);
    border-radius: var(--r);
    font-size: 13px; font-weight: 500;
    min-height: var(--ctl-h);
    border: 1px solid var(--hairline-strong);
    background: var(--control-bg);
    color: var(--text);
    transition: all var(--dur-fast) var(--ease);
  }
  /* El hover tiene que ir hacia ARRIBA en la escala: con --canvas-2 (hundido)
     pasar el ratón oscurecía el botón. */
  .btn:hover { border-color: var(--hairline-strong); background: var(--control-bg-hover); }
  /* Primer plano oscuro sobre relleno saturado: #fff sobre --accent da 2.85:1
     (falla AA). Ver tokens.css §5 --on-*. */
  .btn-primary { background: var(--action); color: var(--on-fill); border-color: var(--action); }
  .btn-primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
  .btn-primary:active { background: var(--action-active); }

  /* Acción acromática (header, sep-2026). Grafito en claro, invertida en oscuro:
     el color de la pantalla queda para el dato. Convive con .btn-primary (naranja)
     mientras el resto de las pantallas no migre a «Instrumento». */
  .btn-action { background: var(--action); color: var(--on-fill); border-color: var(--action); }
  .btn-action:hover { background: var(--action-hover); border-color: var(--action-hover); }
  .btn.on { border-color: var(--action); }

  /* Segmentado del período. Una sola caja con divisores: 4 opciones visibles, el
     resto en «Más». El activo invierte (--action) en vez de teñirse de naranja. */
  .eco-seg { display: flex; border: 1px solid var(--hairline-strong); border-radius: 4px; overflow: hidden; background: var(--control-bg); height: var(--control-h); box-sizing: border-box; }
  .eco-seg > button { border: 0; border-right: 1px solid var(--hairline); background: transparent; color: var(--text-2); padding: 0 12px; font-family: var(--ff-mono); font-size: var(--fs-caption); font-weight: 500; cursor: pointer; }
  .eco-seg > button:last-child { border-right: 0; }
  .eco-seg > button:hover { color: var(--text); background: var(--control-bg-hover); }
  .eco-seg > button.on { background: var(--action); color: var(--on-action); }
  .eco-search-btn { min-width: 180px; }
  /* Bajo ~1280px el header envuelve y el separador quedaba huérfano al final de
     la primera fila, separando el período de nada. */
  @media (max-width: 1280px) { .eco-header-sep { display: none !important; } }

  /* Rail y menús flotantes: hover sin croma. */
  .eco-rail-item { cursor: pointer; transition: background var(--dur-fast) var(--ease); }
  .eco-rail-item:hover:not([aria-current="page"]) { background: var(--rail-tint) !important; }
  .eco-menu-item { cursor: pointer; }
  .eco-menu-item:hover, .eco-menu-item:focus-visible { background: var(--control-bg-hover) !important; }
  .eco-sidebar :focus-visible { outline-color: var(--rail-fg-active); }

  /* Input */
  .input {
    width: 100%;
    padding: 7px 12px;
    /* height exacta, no min-height: `.input` sólo viste campos y selects de una
       línea, y en una barra la altura tiene que ser IGUAL, no "al menos". */
    height: var(--control-h);
    min-height: var(--ctl-h);
    border-radius: var(--r);
    border: 1px solid var(--hairline);
    background: var(--control-bg);
    color: var(--text);
    /* --fs-label es literalmente "labels de formulario, botones, chips" en
       tokens.css §1 y vale los mismos 13px: el campo deja de estar anclado a un
       literal y se mueve con la escala. */
    font-size: var(--fs-label);
    transition: border-color 0.15s var(--ease);
  }
  .input:hover { border-color: var(--hairline-strong); }
  .input:focus { outline: none; border-color: var(--action); }
  /* Un <select> con estilo inline tiene que medir lo mismo que un .input a su
     lado: el piso de :where(select) son 24px (especificidad cero) y dejaba que
     cada sitio inventara su alto con padding. */
  select { min-height: var(--ctl-h); }

  /* Section title */
  .section-eyebrow {
    font-family: var(--ff-mono);
    font-size: var(--fs-overline);
    font-weight: var(--fw-medium);
    color: var(--text-3);
    text-transform: uppercase;
    /* El token existe desde el día uno (tokens.css --tracking-overline: 0.09em) y
       no lo usaba nadie más que el splash: aquí había 0.1em y en screens.js 16
       divs con 0.08em a mano. Un solo valor para todos los overlines. */
    letter-spacing: var(--tracking-overline);
    margin-bottom: var(--sp-1);
  }

  /* Loading shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--canvas-2) 0%, var(--hairline) 50%, var(--canvas-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
    border-radius: 4px;
  }

  /* Tooltip */
  .tt {
    position: relative;
  }
  .tt[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--canvas);
    padding: 5px 8px;
    font-size: var(--fs-caption);
    border-radius: 4px;
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
  }

  /* Row hover */
  .row-hover { transition: background var(--dur-fast) var(--ease); min-height: 28px; }
  .row-hover:hover, .row-hover:focus-visible { background: var(--canvas-2); }
  /* Tópicos: tiles del treemap y burbujas con foco/hover visibles. */
  .eco-tm-tile:hover, .eco-tm-tile:focus-visible { filter: brightness(1.08); outline: 2px solid var(--text); outline-offset: -2px; z-index: 2; }
  .eco-bubble:focus-visible { outline: none; }
  .eco-bubble:focus-visible circle:last-of-type, .eco-bubble:hover circle:last-of-type { stroke: var(--text); stroke-width: 2; }
  /* Tendencia del Overview: el día bajo el cursor o con foco se resalta. */
  .eco-trend-day:hover .eco-trend-hit, .eco-trend-day:focus-visible .eco-trend-hit { fill: var(--action-fill); }
  .eco-trend-day:focus-visible { outline: none; }

  /* Spotlight / command palette */
  .spotlight-backdrop {
    position: fixed; inset: 0;
    background: rgba(11, 26, 38, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 2100;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 12vh;
    animation: fadeIn 0.18s var(--ease);
  }
  [data-mode="dark"] .spotlight-backdrop { background: rgba(0,0,0,0.5); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .spotlight {
    width: 620px; max-width: 90vw;
    background: var(--canvas);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--r-lg);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.35);
    animation: slideUp 0.22s var(--ease);
    overflow: hidden;
  }

  /* Drawer — z-index above Leaflet which goes up to 1000 */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(11, 26, 38, 0.4);
    z-index: 2000;
    animation: fadeIn 0.2s var(--ease);
  }
  [data-mode="dark"] .drawer-backdrop { background: rgba(0,0,0,0.5); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 560px; max-width: 95vw;
    background: var(--canvas);
    border-left: 1px solid var(--hairline);
    z-index: 2001;
    overflow-y: auto;
    animation: slideLeft 0.26s var(--ease);
  }
  @keyframes slideLeft { from { transform: translateX(20px); opacity: 0.6; } to { transform: translateX(0); opacity: 1; } }

  /* Chat contextual — drawer derecho que corre la interfaz a la izquierda.
     No usa backdrop: el dashboard sigue visible y usable mientras chateas. */
  :root { --chat-w: 460px; }
  .chat-drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: var(--chat-w); max-width: 100vw;
    background: var(--canvas);
    border-left: 1px solid var(--hairline);
    z-index: 1999;
    display: flex; flex-direction: column;
    box-shadow: -16px 0 48px -28px rgba(0,0,0,0.55);
    animation: slideLeft 0.28s var(--ease);
  }
  /* padding-right sobre el grid .eco-app encoge el área de contenido (la
     columna 1fr reflota) con transición — el efecto "escalada y responsive". */
  .eco-app[data-chat-open="true"] {
    padding-right: var(--chat-w);
    transition: padding-right 0.28s var(--ease);
  }
  .chat-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--hairline); flex: 0 0 auto;
  }
  .chat-title-btn {
    display: flex; align-items: center; gap: 4px;
    background: var(--canvas-2); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 4px 10px; font-size: var(--fs-caption); font-weight: 600;
    color: var(--text); cursor: pointer; max-width: 240px;
  }
  .chat-list {
    border-bottom: 1px solid var(--hairline);
    max-height: 240px; overflow-y: auto; flex: 0 0 auto; background: var(--canvas-2);
  }
  .chat-list-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; font-size: var(--fs-caption); color: var(--text-2);
    cursor: pointer; border-bottom: 1px solid var(--hairline);
  }
  .chat-list-item:hover { background: var(--canvas); }
  .chat-list-item.active { color: var(--text); background: var(--accent-fill); }
  .chat-del {
    background: transparent; border: none; color: var(--text-3);
    cursor: pointer; padding: 2px; display: flex; opacity: 0; transition: opacity .15s;
  }
  .chat-list-item:hover .chat-del { opacity: 1; }
  .chat-del:hover { color: var(--neg); }
  .chat-msgs {
    flex: 1 1 auto; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-empty { margin: auto 0; }
  .chat-suggest {
    text-align: left; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--hairline); background: var(--canvas-2);
    color: var(--text-2); font-size: var(--fs-body-sm); cursor: pointer; line-height: 1.4;
  }
  .chat-suggest:hover { background: var(--accent-fill); color: var(--text); border-color: var(--accent); }
  .chat-composer {
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px;
    padding: 12px 14px; border-top: 1px solid var(--hairline); background: var(--canvas);
  }
  .chat-input {
    flex: 1; resize: none; border: 1px solid var(--hairline);
    border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4;
    background: var(--canvas-2); color: var(--text); font-family: inherit;
    max-height: 140px; min-height: 40px;
  }
  .chat-input:focus { outline: none; border-color: var(--accent); }
  .chat-send {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 10px;
    border: none; background: var(--action); color: var(--on-fill);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .chat-send:disabled { opacity: 0.45; cursor: default; }
  /* También al corte del sistema. El drawer mide 480px, así que su umbral propio
     de 1100 era una restricción de contenedor razonable — pero convivían cuatro
     cortes (768 / 980 / 1024 / 1100) y ninguno decía por qué era distinto de los
     otros. A 1024 el drawer pasa a pantalla completa justo cuando el sistema deja
     de considerar la ventana un escritorio. */
  @media (max-width: 1024px) {
    .chat-drawer { width: 100vw; max-width: 100vw; border-left: none; }
    .eco-app[data-chat-open="true"] { padding-right: 0; }
  }

  /* Tweaks */
  .tweaks-panel {
    position: fixed; bottom: 16px; right: 16px;
    width: 300px;
    background: var(--canvas);
    border: 1px solid var(--hairline-strong);
    border-radius: var(--r-lg);
    box-shadow: 0 12px 40px -12px rgba(0,0,0,0.25);
    z-index: 120;
    overflow: hidden;
  }

  /* Text edit cursor in mocks */
  /* Enlace = subrayado, no color («Instrumento»): así el único cromo con croma
     queda en la acción destructiva y el error de validación. */
  .link { color: var(--text); cursor: pointer; text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
  .link:hover { text-decoration-thickness: 2px; text-decoration-color: var(--text); }
  .link:hover { text-decoration: underline; }

  /* Subtle divider */
  .hr { height: 1px; background: var(--hairline); border: 0; margin: 0; }

  /* Bar chart rows */
  .bar-track { background: var(--canvas-2); border-radius: var(--r-pill); overflow: hidden; }

  /* Status dot */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

  /* Ticker */
  .ticker { overflow: hidden; white-space: nowrap; }
  .ticker-inner { display: inline-block; animation: tickerRun 60s linear infinite; }
  @keyframes tickerRun { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .pulse { animation: pulse 2s ease-in-out infinite; }

  @keyframes ringPulse {
    0% { box-shadow: 0 0 0 0 var(--neg); }
    100% { box-shadow: 0 0 0 10px rgba(0,0,0,0); }
  }
  .ring-pulse {
    border-radius: 50%;
    animation: ringPulse 1.6s ease-out infinite;
  }

  /* Leaflet: los estilos del contenedor y los controles SÍ pueden ser CSS, así
     que van por token (los que Leaflet recibe como opciones JS van por
     window.ecoTokenValue — ver la nota en charts.js PRMap). Antes esto tenía
     los hex de modo oscuro escritos a mano, así que en modo claro el mapa
     quedaba con tooltip oscuro y controles oscuros sobre un mapa claro. */
  .leaflet-container {
    background: var(--canvas);
    font-family: var(--ff-sans);
  }
  .leaflet-tooltip.eco-map-tooltip {
    background: color-mix(in oklab, var(--surface-overlay) 95%, transparent);
    border: 1px solid var(--hairline-strong);
    color: var(--text);
    box-shadow: var(--shadow-lg);
    padding: var(--sp-15) var(--sp-3);
    border-radius: var(--r-md);
    font-size: var(--fs-caption);
  }
  .leaflet-tooltip.eco-map-tooltip::before { display: none; }
  .leaflet-control-zoom a,
  .leaflet-control-layers-toggle,
  .leaflet-control-layers-expanded {
    background: color-mix(in oklab, var(--surface-overlay) 95%, transparent) !important;
    color: var(--text) !important;
    border: 1px solid var(--hairline-strong) !important;
  }
  .leaflet-control-zoom a:hover,
  .leaflet-control-layers-toggle:hover { background: var(--accent-fill) !important; }
  .leaflet-control-attribution {
    background: color-mix(in oklab, var(--canvas) 70%, transparent) !important;
    color: var(--text-3) !important;
    font-size: var(--fs-overline) !important;
  }
  /* --accent, no --info: `.link` del sistema es --accent y estos eran el único
     azul de la pantalla. */
  .leaflet-control-attribution a { color: var(--accent) !important; }
  /* Los tiles traen un gris neutro (#262626 en el agua) que no pertenece a la
     rampa de superficies (#060A10…#1B2632): el bloque más grande de la pantalla
     se lee como de otro sistema. El filtro los acerca sin tocar la imagen. Sólo
     en oscuro; en claro los tiles ya conviven con --canvas. */
  [data-mode="dark"] .leaflet-tile-pane { filter: saturate(0.75) brightness(0.82) contrast(1.05); }
  .eco-map-marker { transition: stroke-width var(--dur-fast) var(--ease); cursor: pointer; }
  .eco-map-marker:hover { stroke-width: 3 !important; }

  /* ============================================== */
  /* Narrativas — página integrada (oct-2026)        */
  /* ============================================== */
  /* Estado deshabilitado de la primitiva .chip (vivía en el bloque viejo de
     Narrativas; lo usan los chips de orden de otras pantallas). */
  .chip.disabled,
  .chip:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .nx-secn { font: var(--fw-semibold) var(--fs-label) var(--ff-mono); color: var(--canvas); background: var(--text); border-radius: var(--r-sm); padding: 0 var(--sp-15); margin-right: var(--sp-2); }
  .nx-selbar {
    display: flex; align-items: center; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap;
    padding: var(--sp-2) var(--sp-3); background: var(--canvas); border: 1px solid var(--hairline-strong);
    border-radius: var(--r-md); font-size: var(--fs-body-sm);
  }
  .nx-selbar b { font-weight: var(--fw-semibold); }
  .nx-muted { color: var(--text-3); }
  .nx-note { font-size: var(--fs-body-sm); color: var(--text-3); margin: var(--sp-3) 0 0; }
  .nx-over { font-size: var(--fs-overline); font-weight: var(--fw-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .nx-empty { padding: var(--sp-6) var(--sp-4); text-align: center; color: var(--text-3); font-size: var(--fs-body-sm); }
  .nx-legend { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-15) var(--sp-4); font-size: var(--fs-body-sm); color: var(--text-2); }
  .nx-legend > span { display: inline-flex; align-items: center; gap: var(--sp-15); }
  .nx-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .nx-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .nx-badge { display: inline-flex; padding: 0 var(--sp-15); border-radius: var(--r-sm); font: var(--fw-semibold) var(--fs-label) var(--ff-mono); background: var(--canvas-2); color: var(--text-2); border: 1px solid var(--hairline); white-space: nowrap; }
  .nx-delta { font: var(--fw-medium) var(--fs-body-sm) var(--ff-mono); white-space: nowrap; color: var(--text-3); }
  /* Etiquetas de origen y estado: el estado es forma + texto, nunca color. */
  .nx-org { display: inline-flex; align-items: center; padding: 0 var(--sp-15); border-radius: var(--r-sm); font: var(--fw-semibold) var(--fs-label)/20px var(--ff-sans); white-space: nowrap; border: 1px solid var(--hairline-strong); color: var(--text-2); background: var(--canvas); }
  .nx-st { display: inline-flex; align-items: center; gap: 5px; font: var(--fw-semibold) var(--fs-label)/20px var(--ff-mono); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  .nx-st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-sizing: border-box; }
  .nx-st.emerging i { border: 2px solid var(--text); }
  .nx-st.active i { background: var(--text); }
  .nx-st.declining i { background: linear-gradient(90deg, var(--text-3) 50%, transparent 50%); border: 1px solid var(--text-3); }
  .nx-st.dormant i { border: 1px solid var(--text-3); }
  .nx-st.emerging, .nx-st.active { color: var(--text); }
  .nx-st.declining, .nx-st.dormant { color: var(--text-3); }
  /* SVG en píxeles reales: 13px es el piso tipográfico. */
  .nx-svg text { font-family: var(--ff-mono); font-size: var(--fs-caption); fill: var(--text-3); }
  .nx-svg .nx-sans { font-family: var(--ff-sans); font-size: var(--fs-body-sm); }
  .nx-svg .nx-dup { font: var(--fw-semibold) var(--fs-caption) var(--ff-mono); text-transform: uppercase; fill: var(--warn); }
  .nx-band { cursor: pointer; }
  .nx-band:hover { stroke: var(--action); stroke-width: 2; }
  .nx-lane { cursor: pointer; outline: none; }
  .nx-lane:focus-visible rect.nx-hl { stroke: var(--action); stroke-width: 2; }
  .nx-lane:hover rect.nx-hl { fill: var(--action-fill); }
  /* 01 · Historias */
  .nx-hist { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  @media (max-width: 1100px) { .nx-hist { grid-template-columns: 1fr; } }
  .nx-leg-head { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 40px; gap: var(--sp-2); padding: 0 var(--sp-15) var(--sp-1); font-size: var(--fs-caption); color: var(--text-3); }
  .nx-leg-story { margin-bottom: var(--sp-3); }
  .nx-leg-story h4 { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); margin: 0 0 var(--sp-1); min-width: 0; }

  /* 03 · Propagación */
  .nx-prop { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
  @media (max-width: 1100px) { .nx-prop { grid-template-columns: 1fr; } }

  /* ============================================== */

  .sc-mix { display: flex; height: 10px; border-radius: 2px; overflow: hidden; }
  .sc-mix b { display: block; height: 100%; }
  /* Actividad por hora */
  .sc-heat { display: grid; grid-template-columns: 36px repeat(24, minmax(16px, 1fr)) 76px; gap: 2px; align-items: center; min-width: 600px; font: var(--fw-regular) var(--fs-caption) var(--ff-mono); color: var(--text-3); }

  .sc-heat-c:hover, .sc-heat-c:focus-visible { box-shadow: inset 0 0 0 2px var(--action); }
  .sc-heat-c.pk { box-shadow: inset 0 0 0 2px var(--text); }
  .sc-heat-rt { display: flex; align-items: center; gap: var(--sp-1); padding-left: var(--sp-1); color: var(--text-2); }
  .sc-heat-rt b { display: block; height: 6px; background: var(--text-3); border-radius: 1px; }
  .sc-heat-ct { height: 24px; display: flex; align-items: flex-end; justify-content: center; }
  .sc-heat-ct b { display: block; width: 60%; background: var(--text-3); border-radius: 1px; }
  /* Indicadores en filas */
  .sc-krow { display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(90px, .8fr) minmax(110px, .9fr) minmax(140px, 1.4fr) minmax(150px, 1.2fr); gap: var(--sp-4); align-items: center; padding: var(--sp-3) 0; border-top: 1px solid var(--hairline); min-width: 720px; }
  .sc-krow.sc-hd { border-top: 0; padding-top: 0; }
  .sc-krow-nm { display: block; font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--text); }
  .sc-krow-w { display: block; font-size: var(--fs-body-sm); color: var(--text-3); }
  .sc-krow-v { font-size: var(--fs-num-md); font-weight: var(--fw-semibold); color: var(--text); }

  @media (max-width: 640px) {
    .sc-krow { grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2) var(--sp-3); min-width: 0; }

    .sc-krow > span:nth-child(3) { display: flex; gap: var(--sp-3); align-items: baseline; }
    .sc-krow > span:nth-child(3) .sc-krow-w { display: inline; }

  /* Últimas 12 semanas */
  .sc-wk { display: grid; gap: 3px; align-items: center; min-width: 780px; font: var(--fw-medium) var(--fs-caption) var(--ff-mono); }
  .sc-wk-h { text-align: center; color: var(--text-3); padding-bottom: var(--sp-1); }
  .sc-wk-h.cur { color: var(--text); font-weight: var(--fw-semibold); }
  /* El nombre del indicador queda fijo cuando la cuadrícula se desplaza. */
  .sc-wk-nm { font: var(--fw-medium) var(--fs-body-sm) var(--ff-sans); color: var(--text-2); position: sticky; left: 0; z-index: 1; background: var(--canvas); box-shadow: -4px 0 0 var(--canvas); align-self: stretch; display: flex; align-items: center; }
  .sc-wk-c { text-align: center; padding: var(--sp-15) 0; border-radius: var(--r-sm); background: var(--canvas-2); color: var(--text-2); border: 1px solid var(--hairline); }
  .sc-wk-c.good { background: var(--pos-bg); border-color: transparent; color: var(--text); }
  .sc-wk-c.bad { background: var(--neg-bg); border-color: transparent; color: var(--text); }
  .sc-wk-c.hi { background: var(--neu-bg); border-color: transparent; color: var(--text); }
  .sc-wk-c.cur { box-shadow: inset 0 0 0 1.5px var(--text); font-weight: var(--fw-semibold); }
  /* Quién habló */
  .sc-vbars { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: var(--sp-2) var(--sp-3); align-items: center; font-size: var(--fs-body-sm); }
  .sc-stk { display: flex; height: 22px; border-radius: var(--r-sm); overflow: hidden; }
  .sc-stk b { display: flex; align-items: center; justify-content: center; height: 100%; font: var(--fw-semibold) var(--fs-caption) var(--ff-mono); color: var(--on-cat); overflow: hidden; white-space: nowrap; }
  .sc-vrow { display: grid; grid-template-columns: minmax(0, 1.6fr) 72px 72px minmax(0, 1fr); gap: var(--sp-2); align-items: center; padding: var(--sp-2) 0; border-top: 1px solid var(--hairline); font-size: var(--fs-body-sm); }
  .sc-vrow > span:first-child { display: flex; align-items: center; gap: var(--sp-15); min-width: 0; }
  .sc-vrow > span:not(:first-child) { text-align: right; }

    .sc-vrow > span:nth-child(4) { display: none; }

  .sc-stats { display: flex; gap: var(--sp-6); flex-wrap: wrap; margin: var(--sp-4) 0 var(--sp-2); }
  .sc-big { font-size: var(--fs-num-lg); font-weight: var(--fw-semibold); color: var(--text); }
  .sc-big small { font-size: var(--fs-body); font-weight: var(--fw-regular); color: var(--text-3); }
  .sc-voice { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; padding: var(--sp-2) 0; border-top: 1px solid var(--hairline); font-size: var(--fs-body-sm); }
  .sc-voice-n { display: block; font-weight: var(--fw-semibold); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<body>
<div id="eco-root"></div>
<div id="eco-boot" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-2);font-family:var(--ff-sans);font-size:var(--fs-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;background:var(--bg);">Cargando · ECO Social Listening</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script>
  // React hooks exposed as globals because each pre-compiled prototype file
  // destructures them at top level (`const { useState } = React`).
  // Período por defecto del dashboard. Fuente única: la lee el boot de esta
  // página y el estado inicial de `period` en app.js.
  window.ECO_DEFAULT_PERIOD = '7D';
  window.useState = React.useState;
  window.useEffect = React.useEffect;
  window.useCallback = React.useCallback;
  window.useRef = React.useRef;
  window.useMemo = React.useMemo;
  window.Fragment = React.Fragment;

  // A visible banner is better than silently rendering mocks. The banner sits
  // above the dashboard whenever the API call fails so the user knows the
  // numbers they see are seed data, not live.
  function showApiBanner(kind, message) {
    if (document.getElementById('eco-api-banner')) return;
    const banner = document.createElement('div');
    banner.id = 'eco-api-banner';
    banner.style.cssText = [
      'position:fixed','top:0','left:0','right:0','z-index:3000',
      'padding:10px 20px','font-family:var(--ff-sans)','font-size:var(--fs-caption)','font-weight:600',
      'display:flex','gap:12px','align-items:center','justify-content:center',
      'background:' + (kind === 'error' ? 'var(--neg-bg)' : 'var(--warn-bg)'),
      'color:' + (kind === 'error' ? 'var(--neg)' : 'var(--warn)'),
      'border-bottom:1px solid var(--hairline-strong)',
    ].join(';');
    const msg = document.createElement('span');
    msg.textContent = message;
    const retry = document.createElement('button');
    retry.textContent = 'Reintentar';
    retry.style.cssText = 'background:var(--hairline-strong);color:var(--text);border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;';
    retry.onclick = () => location.reload();
    banner.appendChild(msg);
    banner.appendChild(retry);
    document.body.appendChild(banner);
    // Nudge the dashboard down so nothing is hidden under the banner. On narrow
    // screens the message wraps to two/three lines, so measure the real height
    // instead of hard-coding 40px (which left the banner overlapping content).
    const applyOffset = () => {
      const h = Math.ceil(banner.getBoundingClientRect().height) || 40;
      document.documentElement.style.setProperty('--eco-banner-offset', h + 'px');
      document.body.style.paddingTop = h + 'px';
    };
    applyOffset();
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(applyOffset).observe(banner);
    } else {
      window.addEventListener('resize', applyOffset);
    }
  }

  (async function () {
    const params = new URLSearchParams(location.search);
    // Deep-link de correo: /overview?agency=sgpr. Hasta ahora el parámetro
    // alimentaba SÓLO esta petición de arranque; el estado vivo del SPA es
    // localStorage (`eco.agency`), que app.js lee para el selector y que CADA
    // pantalla vuelve a leer en sus propios fetches. Resultado: quien tenía
    // otra agencia guardada abría el correo de SGPR y veía la cabecera, el
    // selector y todas las pantallas perezosas en la agencia anterior. Se
    // promueve a localStorage más abajo (con el slug que el backend REALMENTE
    // sirvió) y se limpia de la URL.
    const urlAgency = params.get('agency');
    const agency = urlAgency || localStorage.getItem('eco.agency') || '';
    // ECO_DEFAULT_PERIOD: mismo default que usa el estado de la barra en
    // app.js. Antes el boot pedía '1M' y el chip arrancaba en '7D', así que
    // en cada sesión limpia —y `ecoSignOut` hace localStorage.clear(), o sea
    // en cada login tras cerrar sesión— la barra decía 7D mientras los datos
    // eran de 30 días.
    const urlPeriod = params.get('period');
    const period = urlPeriod || localStorage.getItem('eco.period') || window.ECO_DEFAULT_PERIOD;
    // Rango personalizado: cuando period === 'custom', el OverviewFilterBar
    // habrá guardado eco.from y eco.to en localStorage. Se envían como query
    // params para que /api/eco-data sobrescriba la ventana derivada de period.
    const fromCustom = params.get('from') || localStorage.getItem('eco.from') || '';
    const toCustom = params.get('to') || localStorage.getItem('eco.to') || '';
    let apiFailed = false;
    let apiError = null;
    try {
      const qs = new URLSearchParams({ period });
      if (agency) qs.set('agency', agency);
      if (period === 'custom' && fromCustom && toCustom) {
        qs.set('from', fromCustom);
        qs.set('to', toCustom);
      }
      const res = await fetch('/api/eco-data?' + qs.toString(), { cache: 'no-store', credentials: 'same-origin' });
      if (res.ok) {
        window.ECO_DATA_REMOTE = await res.json();
      } else if (res.status === 401) {
        // La sesión expiró: intenta renovarla con el refresh token antes de
        // mandar al usuario al login (antes lo expulsaba directo).
        const renewed = await fetch('/api/auth/refresh', { method: 'POST', credentials: 'same-origin' })
          .then((r) => r.ok).catch(() => false);
        const res2 = renewed
          ? await fetch('/api/eco-data?' + qs.toString(), { cache: 'no-store', credentials: 'same-origin' })
          : null;
        if (res2 && res2.ok) {
          window.ECO_DATA_REMOTE = await res2.json();
        } else {
          location.href = '/sign-in?next=' + encodeURIComponent(location.pathname + location.search);
          return;
        }
      } else if (res.status === 429) {
        apiFailed = true;
        apiError = 'Demasiadas solicitudes al servidor. Esperando y reintentando…';
      } else {
        apiFailed = true;
        apiError = 'El servidor devolvió ' + res.status + '. Los datos mostrados son un respaldo estático.';
      }
    } catch (e) {
      apiFailed = true;
      apiError = 'No hay conexión con el servidor. Revisa tu red.';
    }
    // Los parámetros de la URL mandan sobre el estado guardado, pero sólo para
    // esta entrada: se copian a localStorage —única fuente que leen app.js y
    // las pantallas— y se borran de la barra de direcciones. Borrarlos importa
    // tanto como copiarlos: cambiar de agencia dispara `location.reload()`, y
    // con `?agency=` todavía en la URL el arranque resucitaba la agencia del
    // correo y el cambio parecía no surtir efecto.
    if (urlAgency) {
      // El backend puede NO servir la agencia pedida (tenencia: /api/eco-data
      // cae a la agencia primaria si el usuario no tiene acceso). Se guarda la
      // que de verdad respondió para que selector y datos nunca discrepen.
      const served = (window.ECO_DATA_REMOTE && window.ECO_DATA_REMOTE.USER_AGENCY_SLUG) || urlAgency;
      localStorage.setItem('eco.agency', served);
    }
    if (urlPeriod) {
      localStorage.setItem('eco.period', urlPeriod);
      if (urlPeriod === 'custom' && params.get('from') && params.get('to')) {
        localStorage.setItem('eco.from', params.get('from'));
        localStorage.setItem('eco.to', params.get('to'));
      }
    }
    if (urlAgency || urlPeriod || params.get('from') || params.get('to')) {
      const rest = new URLSearchParams(location.search);
      ['agency', 'period', 'from', 'to'].forEach(function (k) { rest.delete(k); });
      const qs = rest.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    }
    // Keep-alive: renueva el idToken (~1h de vida) cada 20 min mientras la
    // pestaña está abierta, para que la sesión no expire en medio del trabajo
    // y expulse al usuario al login al cambiar de período/agencia.
    setInterval(function () {
      fetch('/api/auth/refresh', { method: 'POST', credentials: 'same-origin' }).catch(function () {});
    }, 20 * 60 * 1000);
    const boot = document.getElementById('eco-boot');
    if (boot) boot.remove();
    if (apiFailed) showApiBanner('error', apiError);
    // Load the pre-compiled prototype bundle. Each file is plain JS (no
    // Babel-in-browser cost). Sequential to preserve global dependency order
    // (data -> icons -> charts -> shell -> screens -> app).
    const base = '/eco-prototype/dist';
    const files = ['data.js', 'icons.js', 'charts.js', 'terms-cloud.js', 'shell.js', 'screens.js', 'chat-drawer.js', 'app.js'];
    for (const f of files) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = base + '/' + f + '?v=prodc89';
        s.async = false;
        s.onload = resolve;
        s.onerror = () => {
          console.error('[ECO] failed loading', s.src);
          reject(new Error('Failed to load ' + f));
        };
        document.body.appendChild(s);
      }).catch((e) => {
        const err = document.createElement('pre');
        err.style.cssText = 'color:var(--neg);padding:24px;font-family:var(--ff-mono);white-space:pre-wrap;';
        err.textContent = 'ECO boot error: ' + e.message;
        document.body.appendChild(err);
      });
    }
  })();
</script>
</body>
</html>
